# pETI Sync Server Configuration

resilio_auth:
  user: user
  password: dummy

resilio_host: localhost:8080
resilio_sync_dir: /sync
# Don't change the options if you are not sure what you are doing.
resilio_sync_options: "force=1&search_lan=1&use_hosts=1&overwrite_changes=1&folder_deletetotrash=0&use_sync_trash=0"

# This folder will be used to store the games database and other files
data_dir: ./env/data

# Static folder keys
# Add your own folder, if needed. the default will be sufficient for the eti sync-server
folders:
  eti_launcher:
    secret: "BICDWADB4KCVNR6FCAGYTHEKZBYVUGTZX"

# Predefined hosts for all game folders (optional)
# If specified, these IP:port addresses will be used as direct peers for game sync. Only the mentioned hosts are allowed to connect.
# To disable tracker servers when using predefined_hosts, set USE_PREDEFINED_HOSTS_ONLY=true in the docker-compose.yaml environment variables.
# If empty or not specified, no predefined hosts will be set
predefined_hosts:
# Below are some of eti public sync servers (No warranty on availability)
#  - "66.206.5.74:3001"
#  - "66.165.255.194:3001"
#  - "66.165.255.194:3000"

games:
  denylist:
    - "human"
    - "pummel"
